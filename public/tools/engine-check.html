<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エンジン確認</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 12px; }
  h1 { font-size: 16px; }
  #result { font-size: 14px; line-height: 1.8; }
  .ok { color: #0a6b0a; }
  .ng { color: #a01010; }
  pre { background: #f4f4f4; padding: 8px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>エンジン確認</h1>
<div id="result">実行中…</div>
<pre id="log"></pre>

<script type="module">
// 開発用の確認ページ。serve.py で開く。
//   http://127.0.0.1:8000/tools/engine-check.html
// Firebase へは配信しない（firebase.json の ignore で除外している）。
import { createEngine, guardCrossOriginIsolation } from "../js/usi-engine.js";
import { enumerateLegalMoves, applyMove } from "../js/moves.js";
import { createInitialPosition } from "../js/state.js";
import { boardToSfen } from "../js/coords.js";

const resultEl = document.getElementById("result");
const logEl = document.getElementById("log");
const lines = [];
const result = { steps: [] };

function note(name, value) {
  result.steps.push({ name, value });
  const row = document.createElement("div");
  row.textContent = `${name}: ${value}`;
  resultEl.appendChild(row);
}

const guard = guardCrossOriginIsolation();
result.isolated = guard.ok;
if (!guard.ok) {
  note("分離の判定", guard.message);
  resultEl.className = "ng";
  result.done = true;
  window.__result = result;
  window.__done = true;
} else {
  note("分離の判定", "ok（cross-origin isolated）");

  const startSfen = boardToSfen(createInitialPosition());
  note("初期局面のSFEN", startSfen);

  const engine = await createEngine({
    onLine: (line) => {
      lines.push(line);
      logEl.textContent += line + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    },
    threads: 1,
    hashMb: 32,
  });

  note("id name", engine.idName);

  // 深さ6で指させる
  engine.setPositionSfen(startSfen);
  const bestmove = await engine.goDepth(6);
  note("初期局面の bestmove（深さ6）", bestmove);
  result.bestmove = bestmove;

  // 合法手の列挙（perft 1 を土台にしている）
  const legal = await enumerateLegalMoves(engine, createInitialPosition());
  note("初期局面の合法手の数", legal.length);
  result.legalMoves = legal.length;
  result.hasSampleMoves = ["c3c4", "a1a2", "h2c2"].every((m) => legal.includes(m));

  // perft の突き合わせ。同じ局面を2通りで渡してノード数が一致するか。
  const afterTwoMoves = applyMove(applyMove(createInitialPosition(), "c3c4"), "g7g6");
  const sfenFromMoves = boardToSfen(afterTwoMoves);
  engine.setPositionSfen(sfenFromMoves);
  const nodesFromFen = await engine.goPerft(3);
  engine.setPositionMoves(["c3c4", "g7g6"]);
  const nodesFromMoves = await engine.goPerft(3);
  note("perft 3（position fen）", nodesFromFen);
  note("perft 3（startpos moves）", nodesFromMoves);
  note("2通りの局面が同じか", nodesFromFen === nodesFromMoves ? "一致" : "不一致");
  result.perftFromFen = nodesFromFen;
  result.perftFromMoves = nodesFromMoves;

  // 終局（合法手が無い局面）でエンジンが何を返すかを実測する。
  // 5一の後手玉を、5二と6二の先手金で詰ませた形。
  const mateSfen = "4k4/3GG4/9/9/9/9/9/9/9[-] b 0 1";
  engine.setPositionSfen(mateSfen);
  const mateNodes = await engine.goPerft(1);
  note("詰み局面の合法手の数", mateNodes);

  lines.length = 0;
  engine.setPositionSfen(mateSfen);
  const mateBestmove = await engine.goDepth(5);
  note("詰み局面の bestmove", JSON.stringify(mateBestmove));
  note("詰み局面の生の出力", JSON.stringify(lines.filter((l) => l.startsWith("bestmove"))));
  result.mateNodes = mateNodes;
  result.mateBestmove = mateBestmove;

  engine.quit();
  result.done = true;
  window.__result = result;
  window.__done = true;
}
</script>
</body>
</html>
