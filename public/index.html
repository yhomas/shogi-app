<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>将棋鍛錬アプリ</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="app">

  <header class="bar">
    <div class="turn" id="turn">読み込み中…</div>
  </header>

  <details class="settings" open>
    <summary>強さの設定</summary>
    <div class="bar">
      <label><input type="radio" name="strength-mode" id="mode-depth" value="depth" checked> 深さ指定</label>
      <label>深さ <input id="depth" type="number" min="1" max="40" step="1" value="10"></label>
      <label>Skill Level <input id="skill" type="number" min="-20" max="20" step="1" value="20"></label>
    </div>
    <div class="bar">
      <label><input type="radio" name="strength-mode" id="mode-elo" value="elo"> Elo指定</label>
      <label>Elo <input id="elo" type="number" min="500" max="2850" step="10" value="1350"></label>
      <label>スレッド <input id="threads" type="number" min="1" max="8" step="1" value="1"></label>
      <label>ハッシュ(MB) <input id="hash-mb" type="number" min="16" max="256" step="16" value="64"></label>
      <label>複数候補 <input id="multi-pv" type="number" min="1" max="10" step="1" value="1"></label>
    </div>
    <div class="bar">
      <label for="play-mode">モード</label>
      <select id="play-mode">
        <option value="practice" selected>練習（評価値を見せない）</option>
        <option value="study">検討（評価値と候補手を見せる）</option>
      </select>
      <button id="settings-save" type="button">設定を保存</button>
    </div>
    <p class="hint" id="settings-status"></p>
    <p class="note">
      このエンジンは NNUE の評価ファイルを含まないため<strong>古典評価</strong>で動きます。
      同じ深さでもネイティブ版（PC にインストールして動かす版）より弱くなります。
      相手の強さを合わせたいときは「Elo指定」を使ってください。
    </p>
  </details>

  <section class="panel" id="analysis-panel" hidden>
    <h2>検討</h2>
    <p class="hint" id="analysis-summary"></p>
    <ol class="pv-list" id="pv-list"></ol>
  </section>

  <div class="bar">
    <button id="new-game" type="button">新対局</button>
    <button id="undo" type="button">待った</button>
    <label for="attack-mode">利きの表示</label>
    <select id="attack-mode">
      <option value="both" selected>自分と相手</option>
      <option value="mine">自分だけ</option>
      <option value="opp">相手だけ</option>
      <option value="none">表示しない</option>
    </select>
  </div>

  <div class="bar kif">
    <label for="kif-file">棋譜（kif）を読む</label>
    <input id="kif-file" type="file" accept=".kif,.txt,text/plain">
    <label for="kif-upto">開始手数 <output id="kif-upto-label">0</output></label>
    <input id="kif-upto" type="range" min="0" max="0" value="0" step="1">
    <label for="my-side">自分が指す側</label>
    <select id="my-side">
      <option value="w" selected>先手</option>
      <option value="b">後手</option>
    </select>
    <button id="kif-apply" type="button">この局面から対局</button>
  </div>
  <div class="hint" id="kif-status"></div>

  <section class="hand" id="hand-opp"></section>
  <div id="board"></div>
  <section class="hand" id="hand-mine"></section>

  <div class="message" id="message"></div>

  <section class="panel" id="check-panel" hidden>
    <h2>指す前に確認</h2>
    <p class="hint" id="check-move"></p>
    <ul class="check-list" id="check-list"></ul>
    <div class="bar">
      <button id="check-play" type="button" disabled>指す</button>
      <button id="check-cancel" type="button">この手をやめる</button>
    </div>
  </section>

  <details class="settings">
    <summary>チェック項目の登録</summary>
    <div class="bar">
      <input id="item-text" type="text" placeholder="確認する内容（例: 飛車角を動かしていないか）" size="30">
      <select id="item-condition"></select>
    </div>
    <div class="bar">
      <label>piece <input id="item-piece" type="text" placeholder="rook_bishop" size="12"></label>
      <label>squares <input id="item-squares" type="text" placeholder="a1,b2" size="10"></label>
      <label>count <input id="item-count" type="number" min="0" size="3"></label>
      <label>ply <input id="item-ply" type="number" min="0" size="3"></label>
      <label>優先度
        <select id="item-priority">
          <option value="high">高</option>
          <option value="normal" selected>中</option>
          <option value="low">低</option>
        </select>
      </label>
      <button id="item-add" type="button">追加</button>
    </div>
    <p class="hint" id="item-status"></p>
    <ul class="item-list" id="item-list"></ul>
  </details>

  <footer class="footer">
    エンジン: <a href="./engine/COPYING.txt">Fairy-Stockfish</a>（GPL-3.0）。
    <code>engine/</code> に同梱した WebAssembly 版を読み込んでいます。
    このアプリ自体はビルド不要で、配信しているのは <code>public/</code> の中身だけです。
  </footer>

</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
